<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Server — GitHub Realtime Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0b1120;--card:#111827;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--cyan:#06b6d4;--green:#22c55e;--red:#ef4444;--yellow:#eab308;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:1rem}
  .container{max-width:1200px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;background:var(--card);border:1px solid var(--border);padding:1rem 1.5rem;border-radius:12px;margin-bottom:1rem}
  header h1{font-size:1.1rem}header h1 span{color:var(--cyan)}
  .status-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .9rem;border-radius:20px;font-size:.8rem;font-weight:600}
  .status-badge.live{background:rgba(34,197,94,.15);color:var(--green)}
  .status-badge.error{background:rgba(239,68,68,.15);color:var(--red)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1rem}
  .stat-card{background:var(--card);border:1px solid var(--border);padding:1rem 1.2rem;border-radius:12px;position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
  .stat-card.green::before{background:var(--green)}.stat-card.yellow::before{background:var(--yellow)}.stat-card.red::before{background:var(--red)}
  .stat-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
  .stat-value{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
  .stat-delta{font-size:.75rem;margin-top:.3rem;color:var(--muted)}
  .charts{display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-bottom:1rem}
  @media(max-width:900px){.charts{grid-template-columns:1fr}}
  .chart-card{background:var(--card);border:1px solid var(--border);padding:1rem 1.2rem;border-radius:12px}
  .chart-card h3{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.8rem;display:flex;justify-content:space-between}
  .chart-container{position:relative;height:250px}
  .chart-container.small{height:200px}
  .footer{text-align:center;color:var(--muted);font-size:.75rem;padding:1rem 0}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>⛏️ Minecraft Server <span>GitHub Monitor</span></h1>
      <p style="font-size:.75rem;color:var(--muted);margin-top:.2rem">Data dari <code>data.json</code> — diupdate via GitHub Actions</p>
    </div>
    <div style="display:flex;gap:.7rem;align-items:center;flex-wrap:wrap">
      <span class="status-badge error" id="statusBadge"><span class="dot"></span><span id="statusText">Menghubungkan…</span></span>
      <button id="refreshBtn" style="padding:.5rem 1rem;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer">🔄 Refresh</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="stat-label">Players</div><div class="stat-value" id="sPlayers">—</div><div class="stat-delta" id="dPlayers">—</div></div>
    <div class="stat-card green"><div class="stat-label">TPS</div><div class="stat-value" id="sTps">—</div><div class="stat-delta" id="dTps">—</div></div>
    <div class="stat-card yellow"><div class="stat-label">RAM</div><div class="stat-value" id="sRam">—</div><div class="stat-delta" id="dRam">—</div></div>
    <div class="stat-card red"><div class="stat-label">CPU</div><div class="stat-value" id="sCpu">—</div><div class="stat-delta" id="dCpu">—</div></div>
    <div class="stat-card"><div class="stat-label">Ping</div><div class="stat-value" id="sPing">—</div><div class="stat-delta" id="dPing">—</div></div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <h3><span>📈 Players & TPS (histori lokal)</span><span id="chartCount" style="font-size:.7rem;color:var(--muted)">0 titik</span></h3>
      <div class="chart-container"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>📊 Resource</h3>
      <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <div class="chart-card">
    <h3>🌐 Ping History</h3>
    <div class="chart-container small"><canvas id="pingChart"></canvas></div>
  </div>

  <div class="footer" id="footer">Memuat…</div>
</div>

<script>
/* ============================================================
   KONFIGURASI — GANTI SESUAI REPO KAMU
   ============================================================ */
const GITHUB_USER = 'USERNAME_KAMU';
const GITHUB_REPO = 'NAMA_REPO_KAMU';
const GITHUB_BRANCH = 'main'; // atau 'master'
const DATA_PATH = 'data.json';

// URL raw file (bisa diakses tanpa auth untuk repo publik)
const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${DATA_PATH}`;

// Interval polling (ms). Raw GitHub cache ~5 menit, jadi 15–30 detik wajar.
const POLL_INTERVAL = 15000;

/* ============================================================
   STATE
   ============================================================ */
const MAX_POINTS = 60;
const history = { labels: [], players: [], tps: [], ping: [] };
let prev = null;

/* ============================================================
   CHART
   ============================================================ */
const chartOpts = {
  responsive: true, maintainAspectRatio: false,
  plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } } },
  scales: {
    x: { ticks: { color: '#9ca3af', font: { size: 10 } }, grid: { color: '#1f2937' } },
    y: { ticks: { color: '#9ca3af', font: { size: 10 } }, grid: { color: '#1f2937' }, beginAtZero: true }
  }
};

const mainChart = new Chart(document.getElementById('mainChart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { label: 'Players', data: [], borderColor: '#06b6d4', backgroundColor: 'rgba(6,182,212,0.1)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2, yAxisID: 'y' },
    { label: 'TPS', data: [], borderColor: '#22c55e', backgroundColor: 'transparent', tension: 0.4, pointRadius: 0, borderWidth: 2, yAxisID: 'y1', borderDash: [5,3] }
  ]},
  options: { ...chartOpts, interaction: { intersect: false, mode: 'index' },
    scales: { x: chartOpts.scales.x,
      y: { ...chartOpts.scales.y, position: 'left', title: { display: true, text: 'Players', color: '#9ca3af', font:{size:10} } },
      y1: { position: 'right', min: 0, max: 20, ticks: { color: '#22c55e', font:{size:10} }, grid: { display: false } }
    }
  }
});

const pieChart = new Chart(document.getElementById('pieChart'), {
  type: 'doughnut',
  data: { labels: ['RAM', 'CPU', 'Free'], datasets: [{ data: [0,0,100], backgroundColor: ['#eab308','#ef4444','#1f2937'], borderColor: '#111827', borderWidth: 2 }] },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af', font:{size:11} } } }, cutout: '65%' }
});

const pingChart = new Chart(document.getElementById('pingChart'), {
  type: 'line',
  data: { labels: [], datasets: [{ label: 'Ping (ms)', data: [], borderColor: '#a855f7', backgroundColor: 'rgba(168,85,247,0.1)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }] },
  options: { ...chartOpts, plugins: { legend: { display: false } } }
});

/* ============================================================
   FETCH & UPDATE
   ============================================================ */
async function fetchMetrics() {
  try {
    // Cache-buster agar tidak kena cache GitHub raw
    const url = RAW_URL + '?t=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Validasi minimal
    if (typeof data.players !== 'number' || typeof data.tps !== 'number') {
      throw new Error('Format data.json tidak valid');
    }

    updateUI(data);
    setStatus(true, 'Live');
    document.getElementById('footer').textContent =
      `Terakhir update: ${data.timestamp || '—'} · Sumber: ${RAW_URL}`;

  } catch (err) {
    console.error(err);
    setStatus(false, 'Error');
    document.getElementById('footer').textContent = 'Gagal memuat data: ' + err.message;
  }
}

function setStatus(ok, text) {
  const badge = document.getElementById('statusBadge');
  badge.className = 'status-badge ' + (ok ? 'live' : 'error');
  document.getElementById('statusText').textContent = text;
}

function updateUI(d) {
  // Stat cards
  document.getElementById('sPlayers').textContent = d.players ?? '—';
  document.getElementById('sTps').textContent = (d.tps ?? 0).toFixed(1);
  document.getElementById('sRam').textContent = (d.ram ?? 0) + '%';
  document.getElementById('sCpu').textContent = (d.cpu ?? 0) + '%';
  document.getElementById('sPing').textContent = (d.ping ?? 0).toFixed(0) + ' ms';

  // Delta sederhana (hanya informatif)
  if (prev) {
    const dp = d.players - prev.players;
    document.getElementById('dPlayers').textContent = (dp >= 0 ? '+' : '') + dp + ' dari sebelumnya';
    document.getElementById('dPlayers').style.color = dp >= 0 ? 'var(--green)' : 'var(--red)';
  }
  prev = d;

  // Pie
  const free = Math.max(0, 100 - (d.ram||0) - (d.cpu||0)*0.3);
  pieChart.data.datasets[0].data = [d.ram||0, (d.cpu||0)*0.3, free];
  pieChart.update('none');

  // History (hanya di memori browser, reset saat reload)
  const label = new Date(d.timestamp || Date.now()).toLocaleTimeString('id-ID', { hour12: false });
  history.labels.push(label);
  history.players.push(d.players || 0);
  history.tps.push(d.tps || 0);
  history.ping.push(d.ping || 0);

  ['labels','players','tps','ping'].forEach(k => {
    if (history[k].length > MAX_POINTS) history[k].shift();
  });

  mainChart.data.labels = history.labels;
  mainChart.data.datasets[0].data = history.players;
  mainChart.data.datasets[1].data = history.tps;
  mainChart.update('none');

  pingChart.data.labels = history.labels;
  pingChart.data.datasets[0].data = history.ping;
  pingChart.update('none');

  document.getElementById('chartCount').textContent = history.players.length + ' titik';
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('refreshBtn').addEventListener('click', fetchMetrics);
fetchMetrics();
setInterval(fetchMetrics, POLL_INTERVAL);
</script>
</body>
</html>
